[package]
name = "kotomori-tools"
version.workspace = true
description = "Built-in tools for Kotomori"
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
kotomori-core.workspace = true
process-wrap = { workspace = true, features = ["job-object", "kill-on-drop", "process-group", "tokio1"] }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }

[dev-dependencies]
tempfile.workspace = true
