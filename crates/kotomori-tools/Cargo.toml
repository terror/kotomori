[package]
name = "kotomori-tools"
version = "0.4.1"
description = "Built-in tools for Kotomori"
authors = ["Liam <liam@scalzulli.com>"]
license = "CC0-1.0"
homepage = "https://github.com/terror/kotomori"
repository = "https://github.com/terror/kotomori"
edition = "2024"

[lints]
workspace = true

[dependencies]
kotomori-core = { version = "0.4.1", path = "../kotomori-core" }
process-wrap = { version = "10.0.1", default-features = false, features = ["job-object", "kill-on-drop", "process-group", "tokio1"] }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "macros", "process", "rt", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
