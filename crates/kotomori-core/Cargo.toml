[package]
name = "kotomori-core"
version = "0.4.1"
description = "Core engine for Kotomori"
authors = ["Liam <liam@scalzulli.com>"]
license = "CC0-1.0"
homepage = "https://github.com/terror/kotomori"
repository = "https://github.com/terror/kotomori"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt"] }
