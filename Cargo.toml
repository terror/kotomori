[package]
name = "kotomori"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.lints.rust]
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arbitrary-source-item-ordering = "deny"
wildcard_imports = "allow"

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1

[dependencies]
anthropic-sdk-rust = "0.1.1"
anyhow = "1.0.102"
async-openai = { version = "0.40.2", default-features = false, features = ["rustls", "chat-completion"] }
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.32"
inventory = "0.3.24"
ratatui-textarea = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2.2"
