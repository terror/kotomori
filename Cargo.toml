[package]
name = "kotomori"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.lints.rust]
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arbitrary-source-item-ordering = "deny"
wildcard_imports = "allow"

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.32"
indoc = "2.0.7"
ratatui-textarea = "0.9.1"
rig = { version = "0.37.0", default-features = false, features = ["reqwest", "rustls"] }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smallvec = "1.15.1"
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.52.3", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2.2"

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3.27.0"
vt100 = "0.16.2"
