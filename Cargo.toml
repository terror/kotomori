[package]
name = "kotomori"
version = "0.4.1"
description = "A coding agent"
authors = ["Liam <liam@scalzulli.com>"]
license = "CC0-1.0"
homepage = "https://github.com/terror/kotomori"
repository = "https://github.com/terror/kotomori"
edition = "2024"
autotests = false
categories = ["command-line-utilities", "development-tools"]
keywords = ["ai", "agent", "coding", "terminal", "cli"]
include = [
  "/LICENSE",
  "/README.md",
  "/migrations/",
  "/etc/",
  "/screenshot.png",
  "/src/",
  "/tests/",
]

[workspace]
default-members = [
  ".",
  "crates/kotomori-core",
  "crates/kotomori-rig",
  "crates/kotomori-tools",
]
members = [".", "crates/*"]
resolver = "2"

[workspace.lints.rust]
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arbitrary_source_item_ordering = "deny"
wildcard_imports = "allow"

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/lib.rs"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
anstyle = "1.0.14"
anyhow = "1.0.102"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4.6.1", features = ["derive"] }
confy = "2.0.0"
crossterm = "0.29.0"
futures-util = "0.3.32"
indoc = "2.0.7"
kotomori-core = { version = "0.4.1", path = "crates/kotomori-core" }
kotomori-rig = { version = "0.4.1", path = "crates/kotomori-rig" }
kotomori-tools = { version = "0.4.1", path = "crates/kotomori-tools" }
ratatui-core = { version = "0.1.0", default-features = false, features = ["anstyle"] }
ratatui-textarea = "0.9.1"
rusqlite = { version = "0.40.1", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smallvec = "1.15.1"
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tui-markdown = { version = "0.3.10", default-features = false }
unicode-segmentation = "1.13.2"
unicode-width = "0.2.2"

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3.27.0"
temptree = "0.2.0"
tokio = { version = "1.52.3", features = ["process"] }
vt100 = "0.16.2"
